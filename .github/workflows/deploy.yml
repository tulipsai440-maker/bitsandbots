# Auto-deploy Bits & Bots Worker on every push to main.
# Requires GitHub Actions secrets (see AGENTS.md → Deploy).
name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (Nitro cloudflare-module → .output)
        env:
          # Public client keys — required at build time (Vite inlines VITE_*).
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
        run: npm run build

      - name: Deploy Worker (.output/server)
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Nitro emits entry + wrangler.json under .output/server (root wrangler.toml has no `main`).
          # Preserve dashboard secrets (BAND_ICAL_URL, service role, Resend, etc.).
          command: deploy --config .output/server/wrangler.json --keep-vars
