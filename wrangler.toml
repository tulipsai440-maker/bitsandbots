# Merged into the Worker deploy config on build.
# Secrets (BAND_ICAL_URL, SUPABASE_SERVICE_ROLE_KEY, RESEND_API_KEY, WHATSAPP_ACCESS_TOKEN): keep in Cloudflare Dashboard only.
# Always deploy with: npm run deploy  (--keep-vars preserves dashboard secrets not listed here)

name = "bitsandbots"
compatibility_date = "2026-07-21"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = true
# Keep dashboard-only vars/secrets that are not defined in this file.
keep_vars = true

# Zone routes (Worker intercepts before dead origin; avoids DNS delete requiring Zone.DNS Edit).
# Prefer Custom Domains later: delete A/CNAME for apex+www in CF DNS, then use custom_domain = true.
[[routes]]
pattern = "fllbots.com/*"
zone_name = "fllbots.com"

[[routes]]
pattern = "www.fllbots.com/*"
zone_name = "fllbots.com"

[vars]
# Production site origin. Local `npm run dev` still uses http://localhost:8080 via Vite.
SITE_ORIGIN = "https://fllbots.com"
SUPABASE_URL = "https://njhiqsbykiggxqkjrxse.supabase.co"

# Daily overdue assignment emails to parents (day after due date). 15:00 UTC ≈ 10–11 AM Eastern.
[triggers]
crons = ["0 15 * * *"]
